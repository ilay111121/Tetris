name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --user buildozer cython==0.29.34
      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yes | buildozer android debug || test ${PIPESTATUS[1]} -eq 0
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tetris-APK
          path: bin/*.apk
